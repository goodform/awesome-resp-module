name: Refresh readme.md
on:
  schedule:
    # 每 4 小时整点运行一次（UTC）
    - cron: '0 */4 * * *'
  workflow_dispatch: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要可写权限把更新后的 readme.md commit & push 回仓库
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python deps
        run: pip install pyyaml
      # 跑完整流水线：format readme.md from libraries.yml + 模板，并跑 awesome-lint
      - name: Format and lint readme.md
        run: python3 scripts/format-awesome-resp.py
      # 仅当 readme.md 实际有变化时才 commit & push
      - name: Commit refreshed readme.md
        run: |
          if git diff --quiet -- readme.md; then
            echo "readme.md is already up-to-date; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git commit -m "chore(readme): scheduled refresh from libraries.yml"
          git push
